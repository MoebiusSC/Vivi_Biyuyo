name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.lock -e ".[dev]"
      - run: pytest -q
      - name: Validate Compose and build image
        run: |
          cp .env.example .env
          mkdir -p secrets
          printf 'fixture-only' > secrets/fomo_api_key
          docker compose config --quiet
          docker compose build
      - name: Smoke test without provider credentials
        run: |
          : > secrets/fomo_api_key
          docker compose up -d --wait --wait-timeout 120
          curl --fail http://127.0.0.1:8080/health
          curl --fail http://127.0.0.1:8080/
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ready)" = 503
          docker compose restart vivi
          sleep 5
          curl --fail http://127.0.0.1:8080/health
      - if: always()
        run: docker compose down
